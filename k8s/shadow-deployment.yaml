apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-production
  namespace: aceest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      role: production
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: production
    spec:
      containers:
        - name: aceest-app
          image: <YOUR_DOCKERHUB_USERNAME>/aceest-fitness:v1.0.0
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: shadow
    spec:
      containers:
        - name: aceest-app
          image: <YOUR_DOCKERHUB_USERNAME>/aceest-fitness:v1.1.0   
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-production-svc
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    role: production
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-svc
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    role: shadow
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow-ingress
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/mirror-uri: "http://aceest-shadow-svc.aceest.svc.cluster.local/"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  rules:
    - host: aceest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-production-svc
                port:
                  number: 80
