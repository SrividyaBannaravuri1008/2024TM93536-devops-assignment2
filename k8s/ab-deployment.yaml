apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-a
  namespace: aceest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      version: A
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: A
    spec:
      containers:
        - name: aceest-app
          image: <YOUR_DOCKERHUB_USERNAME>/aceest-fitness:v1.0.0
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-b
  namespace: aceest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      version: B
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: B
    spec:
      containers:
        - name: aceest-app
          image: <YOUR_DOCKERHUB_USERNAME>/aceest-fitness:v1.1.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-service-a
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    version: A
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-service-b
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    version: B
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ingress-a
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: aceest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-service-a
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ingress-b
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-User-Group"
    nginx.ingress.kubernetes.io/canary-by-header-value: "beta"
spec:
  rules:
    - host: aceest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-service-b
                port:
                  number: 80
