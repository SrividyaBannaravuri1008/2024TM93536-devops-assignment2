name: ACEest Fitness CI/CD Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install -r requirements.txt flake8

      - run: |
          flake8 app.py --max-line-length=150

  automated-testing:
    needs: build-and-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install -r requirements.txt pytest pytest-cov

      - name: Run Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/ -v --cov=. --cov-report=xml

  docker-build-push:
    needs: automated-testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # - uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USER }}
      #     password: ${{ secrets.DOCKERHUB_PASS }}
      - uses: docker/login-action@v3
        with:
          username: srividya1008
          password: ${{ secrets.DCKR_TOKEN }}
          
      # - run: |
      #     docker build -t srividya1008/aceestfitness:${{ github.sha }} .
      #     docker push srividya1008/aceestfitness:${{ github.sha }}

      #     docker tag srividya1008/aceestfitness:${{ github.sha }} srividya1008/aceestfitness:latest
      #     docker push srividya1008/aceestfitness:latest
          
      - run: |
          docker build -t srividya1008/aceestfitness:latest .
          docker push srividya1008/aceestfitness:latest
      
          for tag in v1.0.0 v1.1.0 v1.1.2 v2.0.1 v2.1.2 v2.2.1 v2.2.4 v3.0.1 v3.1.2 v3.2.4
          do
            docker tag srividya1008/aceestfitness:latest srividya1008/aceestfitness:$tag
            docker push srividya1008/aceestfitness:$tag
          done
